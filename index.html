<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="3600">
<title>Culleens NS Weather</title>
<style>
  /* Everything is sized in vw so it fills any TV resolution (720p, 1080p, 4K). */
  html, body { margin: 0; padding: 0; height: 100%; background: #0d1b2a; color: #f1f5f9; overflow: hidden; }
  body { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #app { padding: 1.4vw 1.8vw; box-sizing: border-box; height: 100vh; display: flex; flex-direction: column; }
  .row { display: flex; }
  .card { background: #1b2b3f; border-radius: 1vw; padding: 1.1vw 1.4vw; box-sizing: border-box; }
  .lbl { font-size: 1.05vw; letter-spacing: 0.15vw; color: #94a3b8; font-weight: 600; text-transform: uppercase; }

  .head { justify-content: space-between; align-items: center; margin-bottom: 1.2vw; }
  .school { display: flex; align-items: center; gap: 1.4vw; font-size: 2.3vw; font-weight: 700; }
  .logo { background: #fff; border-radius: 0.8vw; padding: 0.3vw 0.9vw; height: 6.6vw; display: block; }
  .logo img { height: 100%; display: block; }
  .school small { display: block; font-size: 1.15vw; color: #94a3b8; font-weight: 400; margin-top: 0.2vw; }
  .clock { font-size: 3.6vw; font-weight: 700; text-align: right; line-height: 1; }
  .clock small { display: block; font-size: 1.25vw; font-weight: 400; color: #cbd5e1; margin-top: 0.35vw; }

  .top { gap: 1.2vw; margin-bottom: 1.2vw; }
  .now { flex: 1.35; display: flex; align-items: center; gap: 1.4vw; }
  .bigtemp { font-size: 8.5vw; font-weight: 800; line-height: 0.9; }
  .cond { font-size: 2.1vw; font-weight: 700; margin-bottom: 0.4vw; }
  .feels { font-size: 1.6vw; color: #fde68a; margin-bottom: 0.5vw; }
  .facts { font-size: 1.3vw; line-height: 1.6; color: #e2e8f0; }

  .yard { flex: 1; display: flex; flex-direction: column; }
  .yardrow { display: flex; align-items: center; justify-content: space-between; padding: 0.7vw 0; border-bottom: 0.1vw solid #2c405a; }
  .yardrow:last-child { border-bottom: 0; }
  .yname { font-size: 1.45vw; font-weight: 600; }
  .yname small { display: block; font-size: 1vw; color: #94a3b8; font-weight: 400; }
  .badge { font-size: 1.35vw; font-weight: 800; padding: 0.45vw 1vw; border-radius: 0.6vw; text-align: center; min-width: 11vw; }
  .badge small { display: block; font-size: 0.95vw; font-weight: 600; opacity: 0.9; }
  .go { background: #16a34a; } .coat { background: #d97706; } .wet { background: #2563eb; }

  .today { flex: 0.85; display: grid; grid-template-columns: 1fr 1fr; gap: 0.8vw; }
  .tile { background: #223650; border-radius: 0.7vw; padding: 0.7vw 0.9vw; }
  .tile b { display: block; font-size: 1.9vw; margin-top: 0.15vw; }

  .hours { flex: 1; display: flex; gap: 0.6vw; margin-bottom: 1.2vw; }
  .hr { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 0.8vw 0.3vw; }
  .hr.school-hr { outline: 0.18vw solid #fbbf24; }
  .hr .t { font-size: 1.35vw; font-weight: 700; }
  .hr .c { font-size: 2.2vw; font-weight: 800; }
  .hr .f { font-size: 1vw; color: #fde68a; }
  .bar { width: 70%; height: 0.6vw; background: #2c405a; border-radius: 0.3vw; overflow: hidden; margin-top: 0.4vw; }
  .bar i { display: block; height: 100%; background: #60a5fa; }
  .hr .r { font-size: 1.15vw; color: #93c5fd; font-weight: 700; margin-top: 0.25vw; }

  .bottom { gap: 1.2vw; }
  .day { flex: 1; display: flex; align-items: center; gap: 1vw; }
  .day .dn { font-size: 1.45vw; font-weight: 700; }
  .day .dd { white-space: nowrap; font-size: 1.1vw; color: #cbd5e1; }
  .day .hl { white-space: nowrap; margin-left: auto; text-align: right; font-size: 1.5vw; font-weight: 700; }
  .day .hl small { display: block; font-size: 1.05vw; color: #93c5fd; font-weight: 600; }
  .foot { font-size: 0.9vw; color: #64748b; text-align: right; margin-top: 0.6vw; }
  .msg { font-size: 2.5vw; margin: auto; text-align: center; }
</style>
</head>

  else if (c === 3) b = cloud(-6, -6, DK) + cloud(0, 2, CL);
  else if (c === 45 || c === 48) b = cloud(0, -10, DK) + '<line x1="10" y1="46" x2="54" y2="46" stroke="' + CL + '" stroke-width="3" stroke-linecap="round"/><line x1="16" y1="54" x2="48" y2="54" stroke="' + CL + '" stroke-width="3" stroke-linecap="round"/>';
  else if (c >= 51 && c <= 57) b = cloud(0, -8, CL) + drops([24, 34, 44], 44, 50, 3);
  else if (c === 65 || c === 82 || c === 67) b = cloud(0, -8, DK) + drops([20, 29, 38, 47], 42, 58, 4);
  else if ((c >= 61 && c <= 66) || c === 80 || c === 81) b = cloud(0, -8, CL) + drops([24, 34, 44], 42, 56, 3);
  else if ((c >= 71 && c <= 77) || c === 85 || c === 86) b = cloud(0, -8, CL) + flakes([24, 36, 48], 46);
  else if (c >= 95) b = cloud(0, -8, DK) + '<polygon points="34,36 24,50 32,50 28,62 42,46 34,46 38,36" fill="' + SUN + '"/>';
  else b = cloud(0, 0, CL);
  return '<svg style="width:' + size + 'vw;height:' + size + 'vw" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' + b + '</svg>';
}

/* ---------- Yard verdicts ---------- */
function hourIdx(dateStr, hh) {
  var key = dateStr + 'T' + hh;
  for (var i = 0; i < data.hourly.time.length; i++) if (data.hourly.time[i].substring(0, 13) === key) return i;
  return -1;
}
function verdict(dateStr, br) {
  var h = data.hourly, sH = +br.start.substring(0, 2), eH = +br.end.substring(0, 2);
  if (br.end.substring(3) === '00' && eH > sH) eH--;
  var rain = 0, feels = 99, found = false;
  for (var x = sH; x <= eH; x++) {
    var i = hourIdx(dateStr, pad(x)); if (i < 0) continue; found = true;
    if (h.precipitation_probability[i] > rain) rain = h.precipitation_probability[i];
    if (h.apparent_temperature[i] < feels) feels = h.apparent_temperature[i];
  }
  if (!found) return '<div class="badge" style="background:#334155">No data</div>';
  var cls = 'go', txt = 'Outdoor play';
  if (rain >= WET_ABOVE) { cls = 'wet'; txt = 'Wet play likely'; }
  else if (feels < COAT_BELOW) { cls = 'coat'; txt = 'Coats on'; }
  return '<div class="badge ' + cls + '">' + txt + '<small>' + rain + '% rain &middot; feels ' + Math.round(feels) + '&deg;</small></div>';
}
function yardDay(now) {
  /* Before home time on a school day: today. Otherwise: the next weekday. */
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var last = BREAKS[BREAKS.length - 1].end;
  var after = pad(now.getHours()) + ':' + pad(now.getMinutes()) >= last;
  if (after || d.getDay() === 0 || d.getDay() === 6) {
    do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);
  }
  return d;
}

/* ---------- Render ---------- */
function render() {
  if (!data) return;
  var now = new Date();
  var cur = data.current, h = data.hourly, dl = data.daily;
  var todayStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  var o = '';

  o += '<div class="row head"><div class="school"><div class="logo"><img src="' + LOGO + '" alt=""></div><div>Weather<small>' + PLACE + '</small></div></div>' +
       '<div class="clock">' + pad(now.getHours()) + ':' + pad(now.getMinutes()) +
       '<small>' + DAYS[now.getDay()] + ' ' + ord(now.getDate()) + ' ' + MONTHS[now.getMonth()] + '</small></div></div>';

  /* Now */
  o += '<div class="row top"><div class="card now">' + icon(cur.weather_code, cur.is_day === 1, 10) +
       '<div class="bigtemp">' + Math.round(cur.temperature_2m) + '&deg;</div><div>' +
       '<div class="cond">' + describe(cur.weather_code) + '</div>' +
       '<div class="feels">Feels like ' + Math.round(cur.apparent_temperature) + '&deg;</div>' +
       '<div class="facts">Wind ' + Math.round(cur.wind_speed_10m) + ' km/h ' + compass(cur.wind_direction_10m) +
       ', gusts ' + Math.round(cur.wind_gusts_10m) + '<br>Humidity ' + cur.relative_humidity_2m + '%</div></div></div>';

  /* Yard */
  var yd = yardDay(now);
  var ydStr = yd.getFullYear() + '-' + pad(yd.getMonth() + 1) + '-' + pad(yd.getDate());
  var ydLabel = ydStr === todayStr ? 'Today' : DAYS[yd.getDay()];
  o += '<div class="card yard"><div class="lbl">Yard check: ' + ydLabel + '</div>';
  for (var b = 0; b < BREAKS.length; b++) {
    o += '<div class="yardrow"><div class="yname">' + BREAKS[b].name + '<small>' + ampm(BREAKS[b].start) + ' to ' + ampm(BREAKS[b].end) + '</small></div>' + verdict(ydStr, BREAKS[b]) + '</div>';
  }
  o += '</div>';

  /* Today tiles */
  o += '<div class="card today">' +
       '<div class="tile"><div class="lbl">High / Low</div><b>' + Math.round(dl.temperature_2m_max[0]) + '&deg; / ' + Math.round(dl.temperature_2m_min[0]) + '&deg;</b></div>' +
       '<div class="tile"><div class="lbl">Rain today</div><b>' + dl.precipitation_sum[0].toFixed(1) + ' mm</b></div>' +
       '<div class="tile"><div class="lbl">Sunrise</div><b>' + ampm(hm(dl.sunrise[0])) + '</b></div>' +
       '<div class="tile"><div class="lbl">Sunset</div><b>' + ampm(hm(dl.sunset[0])) + '</b></div>' +
       '<div class="tile"><div class="lbl">UV index</div><b>' + Math.round(dl.uv_index_max[0]) + ' ' + uvText(dl.uv_index_max[0]) + '</b></div>' +
       '<div class="tile"><div class="lbl">Rain chance</div><b>' + dl.precipitation_probability_max[0] + '%</b></div>' +
       '</div></div>';

  /* Hourly: next 12 hours */
  var nowKey = todayStr + 'T' + pad(now.getHours()), start = 0;
  for (var k = 0; k < h.time.length; k++) if (h.time[k].substring(0, 13) >= nowKey) { start = k; break; }
  o += '<div class="hours">';
  for (var j = start; j < start + 12 && j < h.time.length; j++) {
    var hh = +h.time[j].substring(11, 13);
    var inSchool = h.time[j].substring(0, 10) === todayStr && hh >= 9 && hh < 15;
    o += '<div class="card hr' + (inSchool ? ' school-hr' : '') + '"><div class="t">' + (j === start ? 'Now' : ampm(hm(h.time[j]))) + '</div>' +
         icon(h.weather_code[j], h.is_day[j] === 1, 4.6) +
         '<div class="c">' + Math.round(h.temperature_2m[j]) + '&deg;</div>' +
         '<div class="f">Feels ' + Math.round(h.apparent_temperature[j]) + '&deg;</div>' +
         '<div class="bar"><i style="width:' + h.precipitation_probability[j] + '%"></i></div>' +
         '<div class="r">' + h.precipitation_probability[j] + '%</div></div>';
  }
  o += '</div>';

  /* Coming days */
  o += '<div class="row bottom">';
  for (var d = 1; d < dl.time.length; d++) {
    var dd = dOf(dl.time[d]);
    o += '<div class="card day">' + icon(dl.weather_code[d], true, 3.8) +
         '<div><div class="dn">' + DAYS[dd.getDay()] + '</div><div class="dd">' + describe(dl.weather_code[d]) + '</div></div>' +
         '<div class="hl">' + Math.round(dl.temperature_2m_max[d]) + '&deg; / ' + Math.round(dl.temperature_2m_min[d]) + '&deg;<small>' + dl.precipitation_probability_max[d] + '% rain</small></div></div>';
  }
  o += '</div><div class="foot">Forecast updated ' + ampm(hm(cur.time)) + ' &middot; Open-Meteo &middot; gold outline = school hours</div>';

  document.getElementById('app').innerHTML = o;
}

function load() {
  var x = new XMLHttpRequest();
  x.open('GET', URL, true);
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    if (x.status === 200) { try { data = JSON.parse(x.responseText); render(); return; } catch (e) {} }
    if (!data) document.getElementById('app').innerHTML = '<div class="msg">Weather unavailable. Retrying shortly.</div>';
    setTimeout(load, 120000);
  };
  x.send();
}
load();
setInterval(load, 900000);   /* new forecast every 15 minutes */
setInterval(render, 30000);  /* clock and yard check every 30 seconds */
</script>
</body>
</html>
